services:
  - type: web
    name: libreta-calificaciones
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT app:app
    envVars:
      - key: CALIFICACIONES_PATH
        value: /etc/secrets/calificaciones.json
      - key: TRUST_PROXY
        value: "1"
